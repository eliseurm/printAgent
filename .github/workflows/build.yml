name: Build multiplataforma

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "print-agent-v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter o codigo-fonte
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Testar e gerar a aplicacao autocontida
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Criar pacote Linux
        run: tar -C target/distribution -czf target/PrintAgent-linux-x64.tar.gz PrintAgent

      - name: Publicar pacote Linux
        uses: actions/upload-artifact@v7
        with:
          name: PrintAgent-linux-x64
          path: target/PrintAgent-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Obter o codigo-fonte
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Testar e gerar a aplicacao autocontida
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Criar pacote Windows
        shell: pwsh
        run: Compress-Archive -Path target/distribution/PrintAgent -DestinationPath target/PrintAgent-windows-x64.zip

      - name: Publicar pacote Windows
        uses: actions/upload-artifact@v7
        with:
          name: PrintAgent-windows-x64
          path: target/PrintAgent-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
